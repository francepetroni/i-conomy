<section class="bg-white">
  <div class="container">
    <div class="quote-wrap">
      <form class="quote-form" action="https://api.web3forms.com/submit" method="POST">

        <input type="hidden" name="access_key" value="729c32b2-30e8-497e-abf8-3c31e83d9ba8">
        <input type="hidden" name="subject" value="Quote request (ZH) - Piezoelectric Custom Modules">
        <input type="hidden" name="from_name" value="i-conomy.com website">
        <input type="hidden" name="redirect" value="https://i-conomy.com/zh/thanks.html">
        <input type="checkbox" name="botcheck" class="hidden" style="display:none" tabindex="-1" autocomplete="off">

        <div class="field">
          <label for="org">单位名称 <span class="req">*</span></label>
          <input type="text" id="org" name="单位名称" required>
        </div>

        <div class="field">
          <label for="email">电子邮箱 <span class="req">*</span></label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="phone">联系电话</label>
          <input type="tel" id="phone" name="联系电话" placeholder="例如 +86 13000000000">
        </div>

        <div class="field">
          <label for="model">型号名称</label>
          <input type="text" id="model" name="型号名称" value="Custom Modules for Piezoelectric Actuators" readonly>
        </div>

        <div class="field">
          <label for="quantity">数量 <span class="req">*</span></label>
          <input type="number" id="quantity" name="数量" min="1" value="1" required>
        </div>

        <div class="field">
          <label for="application">应用领域 <span class="req">*</span></label>
          <select id="application" name="应用领域" required>
            <option value="">—— 请选择 ——</option>
            <option value="Ground">地面应用</option>
            <option value="Space">航天应用</option>
          </select>
        </div>

        <div class="three-col">
          <div class="field">
            <label for="voltage">所需电压 <span class="req">*</span></label>
            <input type="text" id="voltage" name="所需电压" placeholder="例如 3800 V" required>
          </div>
          <div class="field">
            <label for="capacity">最大容性负载</label>
            <input type="text" id="capacity" name="最大容性负载">
          </div>
          <div class="field">
            <label for="noise">输出噪声</label>
            <input type="text" id="noise" name="输出噪声" placeholder="例如 典型 15 mVpp">
          </div>
        </div>

        <div class="field">
          <label for="message">其他需求</label>
          <textarea id="message" name="其他需求" placeholder="请补充说明您的需求……"></textarea>
        </div>

        <button type="submit">提交</button>
        <div class="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
